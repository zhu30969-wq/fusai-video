<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <style>
    /*
      页面仅呈现标题和视频播放器，不加载第三方字体、脚本或装饰资源。
      max-width 和横向内边距只用于确保手机竖屏、微信与 QQ 内置浏览器中不会溢出。
    */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      color: #111;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    h1 {
      width: min(960px, 100%);
      margin: 0 auto 20px;
      font-size: clamp(1.35rem, 5vw, 2.25rem);
      line-height: 1.35;
      text-align: center;
    }

    video {
      display: block;
      width: min(960px, 100%);
      max-height: calc(100vh - 120px);
      margin: 0 auto;
      background: #000;
    }

</head>

  <h1>蝶翼寻光—剖析光栅衍射原理</h1>

  <!--
    playsinline 避免微信、QQ 等移动端环境在允许的情况下强制全屏。
    视频地址使用 releases/latest 固定别名，后续更换 Release 版本时二维码无需改变。
  -->
  <video controls preload="metadata" playsinline webkit-playsinline>
    <source src="https://github.com/zhu30969-wq/fusai-video/releases/latest/download/fusai-video.mp4" type="video/mp4">
  </video>
</body>
