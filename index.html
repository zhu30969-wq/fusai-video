<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="复赛微视频的在线播放与下载入口">
  <meta name="theme-color" content="#0b1020">
  <title>复赛微视频</title>
  <style>
    /*
      页面只使用系统字体和本地资源，不依赖外部 CDN。
      这样可以减少第三方服务失效对入口页可用性的影响。
    */
    :root {
      color-scheme: dark;
      --bg: #070b16;
      --panel: rgba(18, 26, 48, 0.78);
      --line: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #a9b4c7;
      --accent: #5eead4;
      --accent-strong: #2dd4bf;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(45, 212, 191, 0.16), transparent 32rem),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.13), transparent 34rem),
        var(--bg);
    }

    main {
      width: min(1040px, 100%);
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.6rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 720px;
      margin: 16px 0 28px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.8;
    }

    .video-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      background: #000;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      min-height: 46px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .button.primary {
      border-color: transparent;
      color: #06201d;
      background: var(--accent);
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(94, 234, 212, 0.48);
      background: rgba(255, 255, 255, 0.08);
    }

    .button.primary:hover {
      background: var(--accent-strong);
    }

    .button:focus-visible {
      outline: 3px solid rgba(94, 234, 212, 0.42);
      outline-offset: 3px;
    }

    .meta {
      margin-top: 26px;
      padding-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .meta strong {
      color: var(--text);
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      main {
        border-radius: 20px;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Competition Video</p>
    <h1>复赛微视频</h1>
    <p class="intro">点击下方播放器观看；若当前浏览器不支持在线播放，可使用“打开或下载视频”。</p>

    <section class="video-shell" aria-label="视频播放器">
      <!--
        latest/download 是 GitHub Release 提供的稳定别名。
        后续发布新版本时，只要保持资产文件名 fusai-video.mp4 不变，此页面无需修改。
      -->
      <video controls preload="metadata" playsinline>
        <source src="https://github.com/zhu30969-wq/fusai-video/releases/latest/download/fusai-video.mp4" type="video/mp4">
        当前浏览器不支持 HTML5 视频播放，请使用页面下方的下载链接。
      </video>
    </section>

    <nav class="actions" aria-label="视频操作">
      <a class="button primary" href="https://github.com/zhu30969-wq/fusai-video/releases/latest/download/fusai-video.mp4">打开或下载视频</a>
      <a class="button" href="https://github.com/zhu30969-wq/fusai-video/releases/latest">查看最新版本</a>
      <a class="button" href="https://github.com/zhu30969-wq/fusai-video">访问 GitHub 仓库</a>
    </nav>

    <footer class="meta">
      <span><strong>文件：</strong>fusai-video.mp4 · 约 30.0 MiB</span>
      <span><strong>托管：</strong>GitHub Pages + GitHub Releases</span>
    </footer>
  </main>
</body>
</html>
