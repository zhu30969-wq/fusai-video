<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>蝶翼寻光—剖析光栅衍射原理</title>
  <style>
    /*
      根入口与二维码专用入口保持完全相同：正文只有一个全宽视频。
      黑色页面背景仅用于填充竖屏剩余空间，不引入任何可见界面元素。
    */
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    video {
      display: block;
      width: 100vw;
      height: auto;
      margin: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <!--
    微信与 QQ 会接管 controls 的具体外观；页面本身不创建任何额外控件或说明。
  -->
  <video
    controls
    preload="metadata"
    playsinline
    webkit-playsinline
    disablepictureinpicture
    poster="video-poster.png"
  >
    <source src="https://github.com/zhu30969-wq/fusai-video/releases/latest/download/fusai-video.mp4" type="video/mp4">
  </video>
</body>
</html>
